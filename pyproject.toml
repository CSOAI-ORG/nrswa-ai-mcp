[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nrswa-ai-mcp"
readme = "README.md"
version = "1.0.6"
description = "UK street works compliance. Section 50 licences, S58 deferral, S74 overrun penalties, NRSWA accreditation tracking."
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "MEOK AI Labs", email = "hello@meok.ai"}]
keywords = ["nrswa", "street-works", "section-50", "section-58", "section-74", "utility", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=1.0.0"]

[project.urls]
Homepage = "https://meok.ai"
Repository = "https://github.com/CSOAI-ORG/nrswa-ai-mcp"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["server.py"]

[project.scripts]
nrswa-ai-mcp = "server:main"
